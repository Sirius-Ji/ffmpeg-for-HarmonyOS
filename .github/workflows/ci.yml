name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve expected version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r\"HAR_VERSION = '([^']+)'\", open('harmony/ffmpeg_ohos/BuildProfile.ets', encoding='utf-8').read()).group(1))")
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Source/doc/component consistency
        run: python3 build/check-release.py --source-only

      - name: Script syntax check
        run: python3 -m py_compile build/check-release.py build/make-release.py
